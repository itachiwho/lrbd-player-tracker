<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We've Moved - Fivem Player Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Mulish', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(15, 20, 25, 0.95);
      border-radius: 20px;
      padding: 60px 50px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideUp 0.6s ease;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s ease infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      font-size: 48px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 15px;
      letter-spacing: -1px;
    }
    
    .subtitle {
      font-size: 22px;
      color: #8b92a0;
      margin-bottom: 30px;
      font-weight: 400;
    }
    
    .message {
      font-size: 18px;
      color: #b0b8c4;
      line-height: 1.7;
      margin-bottom: 40px;
    }
    
    .new-link {
      display: inline-block;
      background: linear-gradient(135deg, #3498db 0%, #2ecc71 100%);
      color: white;
      text-decoration: none;
      padding: 18px 50px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
      letter-spacing: 0.5px;
    }
    
    .new-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(52, 152, 219, 0.5);
    }
    
    .new-link:active {
      transform: translateY(-1px);
    }
    
    .url-text {
      margin-top: 25px;
      font-size: 14px;
      color: #5c6370;
      word-break: break-all;
    }
    
    .url-text a {
      color: #3498db;
      text-decoration: none;
      font-weight: 600;
    }
    
    .url-text a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 40px 30px;
      }
      
      h1 {
        font-size: 36px;
      }
      
      .subtitle {
        font-size: 18px;
      }
      
      .message {
        font-size: 16px;
      }
      
      .icon {
        font-size: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚀</div>
    <h1>We've Moved!</h1>
    <p class="subtitle">New & Improved Player Tracker</p>
    <p class="message">
      Our player tracking system has been upgraded with better performance, 
      real-time updates, and an enhanced user experience.
    </p>
    <a href="https://playerlist.itachiweb.top/" class="new-link">
      Visit New Site →
    </a>
    <p class="url-text">
      New URL: <a href="https://playerlist.itachiweb.top/">https://playerlist.itachiweb.top/</a>
    </p>
  </div>
</body>
</html>
